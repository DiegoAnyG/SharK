name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest numpy scipy pandas matplotlib rdkit plotly scikit-image MDAnalysis

      - name: Install SharK
        run: |
          pip install -e .

      - name: Run pytest
        run: |
          pytest -v

  package:
    name: Package Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build distribution packages
        run: |
          python -m build

      - name: Install wheel and verify package resources
        run: |
          pip install dist/*.whl
          python -c "
          from shark.reports import adduct_viewer
          js = adduct_viewer._get_3dmol_js()
          assert len(js) > 1000, '3Dmol-min.js missing from installed package'
          print('Verified 3Dmol-min.js package data successfully.')
          "
