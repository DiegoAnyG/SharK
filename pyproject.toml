[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shark-qc"
version = "0.1.0"
description = "Automated quantum chemical workflow engine and analysis suite"
authors = [{ name = "Diego Cesar Anaya Guerrero" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "rdkit",
    "plotly>=6.1",
    "scikit-image>=0.23"
]

[project.optional-dependencies]
export = ["kaleido>=1.0"]
dev = [
    "pytest>=7.0",
]

[project.scripts]
shark = "shark.cli:main"
shark-orbitals = "shark.reports.orbital_viewer:main"

[tool.setuptools.package-data]
"shark.reports" = ["orbital_viewer.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
